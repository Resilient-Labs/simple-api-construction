<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Only the fonts this page actually uses (faster load) -->
  <link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <title>Blue Collar Job Board</title>
</head>
<body>

  <header class="hero">
    <p class="eyebrow">Blue Collar Job Board</p>
    <h1>Find Plumbers, Carpenters, Electricians and More Across the United States</h1>
  </header>

  <main class="container">

    <!-- Search bar -->
    <div class="search">
      <label for="tradeSelect" class="visually-hidden">Choose a trade</label>
      <select name="trades" id="tradeSelect">
        <option value="Carpenter" class="tradeInput">Carpenter</option>
        <option value="Plumber" class="tradeInput">Plumber</option>
        <option value="Electrican" class="tradeInput">Electrician</option>
        <option value="Construction" class="tradeInput">Construction</option>
        <option value="CDL" class="tradeInput">CDL Driver</option>
        <option value="HVAC" class="tradeInput">HVAC</option>
        <option value="Welder" class="tradeInput">Welder</option>
        <option value="Mechanic" class="tradeInput">Mechanic</option>
      </select>
      <button type="button" id="tradeBtn">Search Jobs</button>
    </div>

    <h2></h2>

    <!-- Job results (empty cards stay hidden until trade.js fills them) -->
    <div class="results">
      <section class="job-card firstCon">
        <p id="firstJob" class="job-title"></p>
        <div class="job-meta">
          <span id="salaryOne" class="tag salary"></span>
          <span id="locOne" class="tag location"></span>
        </div>
      </section>

      <section class="job-card secondCon">
        <p id="secondJob" class="job-title"></p>
        <div class="job-meta">
          <span id="salaryTwo" class="tag salary"></span>
          <span id="locTwo" class="tag location"></span>
        </div>
      </section>

      <section class="job-card thirdCon">
        <p id="thirdJob" class="job-title"></p>
        <div class="job-meta">
          <span id="salaryThree" class="tag salary"></span>
          <span id="locThree" class="tag location"></span>
        </div>
      </section>

      <section class="job-card fourthCon">
        <p id="fourthJob" class="job-title"></p>
        <div class="job-meta">
          <span id="salaryFour" class="tag salary"></span>
          <span id="locFour" class="tag location"></span>
        </div>
      </section>

      <section class="job-card fifthCon">
        <p id="fifthJob" class="job-title"></p>
        <div class="job-meta">
          <span id="salaryFive" class="tag salary"></span>
          <span id="locFive" class="tag location"></span>
        </div>
      </section>

      <section class="job-card sixthCon">
        <p id="sixthJob" class="job-title"></p>
        <div class="job-meta">
          <span id="salarySix" class="tag salary"></span>
          <span id="locSix" class="tag location"></span>
        </div>
      </section>

      <section class="job-card seventhCon">
        <p id="seventhJob" class="job-title"></p>
        <div class="job-meta">
          <span id="salarySeven" class="tag salary"></span>
          <span id="locSeven" class="tag location"></span>
        </div>
      </section>

      <section class="job-card eighthCon">
        <p id="eighthJob" class="job-title"></p>
        <div class="job-meta">
          <span id="salaryEight" class="tag salary"></span>
          <span id="locEight" class="tag location"></span>
        </div>
      </section>

      <section class="job-card ninthCon">
        <p id="ninthJob" class="job-title"></p>
        <div class="job-meta">
          <span id="salaryNine" class="tag salary"></span>
          <span id="locNine" class="tag location"></span>
        </div>
      </section>

      <section class="job-card tenthCon">
        <p id="tenthJob" class="job-title"></p>
        <div class="job-meta">
          <span id="salaryTen" class="tag salary"></span>
          <span id="locTen" class="tag location"></span>
        </div>
      </section>
    </div>

  </main>

  <script src="trade.js"></script>
</body>
</html>
